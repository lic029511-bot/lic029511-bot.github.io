<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>内容管理 · Research Lab</title><style>body{font-family:Arial,'Microsoft YaHei',sans-serif;margin:0;background:#f4f3ed;color:#252922;line-height:1.9}main{max-width:700px;margin:8vh auto;padding:35px;background:white;border:1px solid #dedfd7}h1{font-size:27px;font-weight:500}p{font-size:14px;color:#73796a}a{color:#b85032}code{background:#f4f3ed;padding:2px 7px}.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:30px}.error{color:#b85032}@media(max-width:700px){main{margin:20px;padding:25px}}</style></head><body><main id="setup"><small>CONTENT MANAGEMENT / 内容管理</small><h1>后台登录授权待配置</h1><p>展示页面可以正常使用。这个免费静态版本通过 GitHub 保存资料，启用可视化后台前，还需要配置 GitHub OAuth 登录服务。</p><p>配置完成后，可以通过网页表单编辑中英文内容、上传图片和 PDF，并发布更新。目前没有启用登录服务，因此这里不会模拟“保存成功”。</p><p>准备工作：在 <code>public/admin/settings.json</code> 中设置真实授权服务的 HTTPS 地址。登录授权服务与 GitHub OAuth 应用需单独配置，密钥只能保存在授权服务中。</p><div class="links"><a href="https://github.com/lic029511-bot/lic029511-bot.github.io/tree/main/content" target="_blank" rel="noreferrer">在 GitHub 编辑资料 ↗</a><a href="/">返回网站 →</a></div><p class="error" id="error"></p></main><script>window.CMS_MANUAL_INIT=true;(async()=>{try{const settings=await(await fetch('./settings.json')).json();if(!settings.authBaseUrl)return;const base=new URL(settings.authBaseUrl);if(base.protocol!=='https:')throw Error('授权服务地址必须使用 HTTPS。');const config=await(await fetch('./cms-config.json')).json();config.backend.base_url=base.origin;const script=document.createElement('script');script.src='https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';script.onload=()=>{document.getElementById('setup').remove();window.CMS.init({config});};script.onerror=()=>{document.getElementById('error').textContent='无法加载编辑器，请检查网络后重试。';};document.body.appendChild(script);}catch(error){document.getElementById('error').textContent='后台配置未完成：'+error.message;}})();</script></body></html>
